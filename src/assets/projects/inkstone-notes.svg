<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="砚台笔记占位截图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="600" cy="330" r="300" fill="url(#glow)"/>
  <rect x="360" y="180" width="480" height="330" rx="18" fill="none" stroke="#99f6e4" stroke-opacity="0.55" stroke-width="3"/>
  <line x1="420" y1="270" x2="780" y2="270" stroke="#ccfbf1" stroke-opacity="0.6" stroke-width="8" stroke-linecap="round"/>
  <line x1="420" y1="330" x2="720" y2="330" stroke="#ccfbf1" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  <line x1="420" y1="390" x2="750" y2="390" stroke="#ccfbf1" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  <line x1="420" y1="450" x2="600" y2="450" stroke="#ccfbf1" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
  <circle cx="600" cy="585" r="26" fill="#5eead4" fill-opacity="0.85"/>
  <text x="600" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" letter-spacing="12" fill="#99f6e4" fill-opacity="0.85">INKSTONE</text>
</svg>
