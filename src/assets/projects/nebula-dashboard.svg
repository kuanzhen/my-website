<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="星图数据看板占位截图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="600" cy="330" r="300" fill="url(#glow)"/>
  <circle cx="600" cy="330" r="170" fill="none" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="600" cy="330" r="110" fill="none" stroke="#e8eefc" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="600" cy="160" r="10" fill="#67e8f9"/>
  <circle cx="770" cy="390" r="8" fill="#e8eefc" fill-opacity="0.8"/>
  <circle cx="470" cy="430" r="6" fill="#22d3ee"/>
  <path d="M600 160 L770 390 L470 430 Z" fill="none" stroke="#a5f3fc" stroke-opacity="0.35" stroke-width="2"/>
  <text x="600" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="600" fill="#e8eefc" fill-opacity="0.9">N</text>
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" letter-spacing="12" fill="#a5f3fc" fill-opacity="0.8">NEBULA</text>
</svg>
