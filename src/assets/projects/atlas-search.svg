<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Atlas 文档检索占位截图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="600" cy="330" r="300" fill="url(#glow)"/>
  <rect x="330" y="245" width="540" height="170" rx="24" fill="none" stroke="#c7d2fe" stroke-opacity="0.55" stroke-width="3"/>
  <line x1="760" y1="380" x2="880" y2="500" stroke="#c7d2fe" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round"/>
  <line x1="390" y1="330" x2="560" y2="330" stroke="#e0e7ff" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round"/>
  <line x1="390" y1="365" x2="490" y2="365" stroke="#e0e7ff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" letter-spacing="12" fill="#c7d2fe" fill-opacity="0.85">ATLAS</text>
</svg>
